name: Build Android APK (Hearty Avatar Studio)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Orange_flutter/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd Orange_flutter/Orange
          flutter pub get

      - name: Build Release APK
        run: |
          cd Orange_flutter/Orange
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Verify and Log APK Information
        run: |
          APK_PATH="Orange_flutter/Orange/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "=== APK BUILT SUCCESSFULLY ==="
            ls -lh "$APK_PATH"
            sha256sum "$APK_PATH"
            cp "$APK_PATH" "Orange_flutter/Orange/build/app/outputs/flutter-apk/hearty-v1.0.3.apk"
          else
            echo "ERROR: APK file not found at $APK_PATH"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearty-avatar-studio-release-apk
          path: |
            Orange_flutter/Orange/build/app/outputs/flutter-apk/hearty-v1.0.3.apk
            Orange_flutter/Orange/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.3
          name: "Hearty v1.0.3 — 3D Romantic Love Heart Inside & Out"
          body: |
            ## Hearty v1.0.3 — AI Avatar Studio & Social Streaming Platform

            ### What's New & Updated in v1.0.3:
            - **Complete Internal Branding Overhaul**: Replaced all interior logos and headers with the official **3D Romantic Love Heart** emblem and elegant **Hearty** typography.
            - **No More Orange Remnants**: Replaced `theme_label_white` and `get_started1_label` across the Authentication screen, Dashboard top bar, Live Streaming headers, Profile setup, and Settings screens.
            - **Internal App Name Set to Hearty**: Updated `AppRes.appName` and notification topics to `Hearty` across the whole app.
            - **Splash Screen Watchdog & Fallback**: Retains the zero-hang 3.5s watchdog timer and graceful offline authentication routing.
            - **Launcher & Notification Icon**: High-definition 3D Romantic Love Heart icon with dark aesthetic.
            
            ### Default Accounts:
            - **Admin Dashboard**: `admin` / `admin@123!@#`
            - **Demo User**: `hearty_demo` / `password123`
            
            ### Direct Download:
            Download **`hearty-v1.0.3.apk`** below and install directly onto your Android device (supports Android 7.0+ / API 24+).
          files: |
            Orange_flutter/Orange/build/app/outputs/flutter-apk/hearty-v1.0.3.apk
            Orange_flutter/Orange/build/app/outputs/flutter-apk/app-release.apk


