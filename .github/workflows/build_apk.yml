name: Build Android APK (Hearty Avatar Studio)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Orange_flutter/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd Orange_flutter/Orange
          flutter pub get

      - name: Build Release APK
        run: |
          cd Orange_flutter/Orange
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Verify and Log APK Information
        run: |
          APK_PATH="Orange_flutter/Orange/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "=== APK BUILT SUCCESSFULLY ==="
            ls -lh "$APK_PATH"
            sha256sum "$APK_PATH"
            cp "$APK_PATH" "Orange_flutter/Orange/build/app/outputs/flutter-apk/hearty-v1.0.2.apk"
          else
            echo "ERROR: APK file not found at $APK_PATH"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearty-avatar-studio-release-apk
          path: |
            Orange_flutter/Orange/build/app/outputs/flutter-apk/hearty-v1.0.2.apk
            Orange_flutter/Orange/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.2
          name: "Hearty v1.0.2 — Splash Screen Freeze Fix & 3D Romantic Heart"
          body: |
            ## Hearty v1.0.2 — AI Avatar Studio & Social Streaming Platform

            ### What's Fixed & New in v1.0.2:
            - **Splash Screen Freeze Fix**: Resolved the initialization hang caused by unconfigured base URLs and missing timeout guards. Added an asynchronous safety watchdog and resilient offline fallback routing to ensure the app instantly transitions to the Auth / Dashboard screens.
            - **Robust API & Network Layer**: Added try-catch guards, timeouts (2.5s), and URI validation to network providers so network unreachability never locks the user interface.
            - **New 3D Romantic Love Heart App Icon**: Brand-new custom 3D glossy glowing heart launcher icon with dark squircle theme across all Android densities and iOS.
            - **Official "Hearty" Branding**: Complete naming refresh across Android (`android:label`), iOS (`CFBundleDisplayName`), and Flutter (`GetMaterialApp`).
            - **AI Avatar Live Puppeteering**: Real-time voice viseme lip-sync and canvas rendering.
            - **Agora RTC Video & Audio Live Streaming**: Low-latency video calling and live broadcasting.
            - **Multi-Platform OBS & RTMP Controls**: Virtual camera integration and stream broadcasting.
            - **Multi-Provider & Crypto Payments**: Integrated support for Cards, PayPal, and Direct Cryptocurrency.
            
            ### Default Accounts:
            - **Admin Dashboard**: `admin` / `admin@123!@#`
            - **Demo User**: `hearty_demo` / `password123`
            
            ### Direct Download:
            Download **`hearty-v1.0.2.apk`** below and install directly onto your Android device (supports Android 7.0+ / API 24+).
          files: |
            Orange_flutter/Orange/build/app/outputs/flutter-apk/hearty-v1.0.2.apk
            Orange_flutter/Orange/build/app/outputs/flutter-apk/app-release.apk


